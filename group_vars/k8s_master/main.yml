---
# =============================================================================
# 控制面（k8s_master）专属变量
# =============================================================================

# 业务只调度到 node：控制面默认打 NoSchedule（T013 落实）
k8s_master_taint: true

# apiserver 前置负载均衡（T006）
k8s_lb_bind_address: "0.0.0.0"

# etcd 与控制面同机部署（默认）
k8s_etcd_on_master: true
