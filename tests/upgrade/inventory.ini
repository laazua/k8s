# =============================================================================
#  T015 版本升级与回滚测试 inventory（单机沙箱）
#
#   [k8s_master] cp1   —— 控制面（apiserver/CM/scheduler 渲染目标；pki/etcd 同机）
#   [k8s_node]   node1 —— 工作节点（真实 containerd + kubelet，端口 20250/20248）
#   [etcd]       etcd1 —— 单成员 TLS etcd（12379/12380）
#
#   全部 local 连接 + 高位端口（16443 / 12379 / 20250 / 20248），不占 6443/10250。
#   k8s_version 是**基线版本**（升级前）；升级目标由 -e upgrade_version 给出。
# =============================================================================
[all:vars]
ansible_connection=local
k8s_version=1.31.0
k8s_vip=127.0.0.1
k8s_apiserver_port=16443
k8s_service_cidr=10.96.0.0/12
k8s_dns_domain=cluster.local

# 基线（1.31.0）官方制品：沙箱从本地缓存安装，零网络
kubectl_url=https://dl.k8s.io/v1.31.0/bin/linux/amd64/kubectl
kubectl_sha256=7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380

[k8s_node]
node1 ansible_host=127.0.0.1

# 仅用于沙箱 pki：只为既有节点预签 kubelet 证书（升级不改 PKI）
[k8s_existing_node]
node1 ansible_host=127.0.0.1

[local]
localhost ansible_connection=local
