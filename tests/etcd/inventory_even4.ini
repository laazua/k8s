# =============================================================================
#  T005 测试 inventory（偶数 4 成员，用于「奇数校验独立生效」的 fail-fast）
#  用途：显式 `etcd_min_members=1`（绕过最小成员数 guard）时，4 成员仍必须被
#        奇数校验拒绝 → 锁定 validate.yml 的奇数断言本身。
#  TLS 关闭（测试显式传 etcd_tls_enabled=false）→ 不需要 pki。
# =============================================================================
[all:vars]
k8s_vip=127.0.0.1

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380
etcd2 ansible_host=127.0.0.1 etcd_client_port=22379 etcd_peer_port=22380
etcd3 ansible_host=127.0.0.1 etcd_client_port=32379 etcd_peer_port=32380
etcd4 ansible_host=127.0.0.1 etcd_client_port=42379 etcd_peer_port=42380

[local]
localhost ansible_connection=local
