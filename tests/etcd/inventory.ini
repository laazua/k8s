# =============================================================================
#  T005 测试 inventory（奇数 3 成员）
#  说明：三个 etcd 成员都指向本机（127.0.0.1），用**不同高位端口**模拟 3 台主机；
#        成员名/地址/端口全部来自 inventory → 证明 role 无硬编码。
#        [k8s_master] 仅用于让 pki role 推导 SAN（不会被连接）。
# =============================================================================
[all:vars]
k8s_vip=127.0.0.1
k8s_service_cidr=10.96.0.0/12
k8s_dns_domain=cluster.local

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380
etcd2 ansible_host=127.0.0.1 etcd_client_port=22379 etcd_peer_port=22380
etcd3 ansible_host=127.0.0.1 etcd_client_port=32379 etcd_peer_port=32380

# pki 沙箱 play 的执行目标（唯一真实主机）；其它主机只作为拓扑数据来源
[local]
localhost ansible_connection=local
