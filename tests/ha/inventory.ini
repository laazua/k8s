# =============================================================================
#  T006 测试 inventory
#  两台“master”都通过 local 连接（真正执行发生在测试脚本创建的 netns 中）。
#  ansible_host 是 netns 内的 L2 地址，role 渲染后端时从这里读取（非硬编码）。
#  keepalived_interface / priority 按主机不同，证明模板完全由变量驱动。
# =============================================================================
[all:vars]
k8s_vip=10.99.0.100
k8s_apiserver_port=6443

[k8s_master]
ha1 ansible_connection=local ansible_host=10.99.0.1 keepalived_interface=veth-ha1 keepalived_priority=150
ha2 ansible_connection=local ansible_host=10.99.0.2 keepalived_interface=veth-ha2 keepalived_priority=100
