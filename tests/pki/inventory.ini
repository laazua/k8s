# =============================================================================
#  T004 测试 inventory（主）
#  说明：本文件只服务于 tests/pki/sandbox.yml（play 限制在 localhost），
#        其余主机**不会被连接**——仅用于让 role 从分组推导 SAN（不硬编码）。
#        IP 故意用 10.10.0.x/10.10.1.x（示例网段），与任何真实环境无关。
# =============================================================================
[all:vars]
k8s_vip=10.10.0.100
k8s_service_cidr=10.96.0.0/12
k8s_apiserver_port=6443
k8s_dns_domain=cluster.local

[k8s_master]
k8s-master1 ansible_host=10.10.0.11
k8s-master2 ansible_host=10.10.0.12
k8s-master3 ansible_host=10.10.0.13

[etcd]
k8s-master1
k8s-master2
k8s-master3

[k8s_node]
k8s-node1 ansible_host=10.10.0.21
k8s-node2 ansible_host=10.10.0.22

# 被测 play 的执行目标（唯一真实主机）；其它分组只作为 SAN 数据来源
[local]
localhost ansible_connection=local
