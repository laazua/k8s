#        与主 inventory 完全不同（不同 VIP / 主机名 / 服务网段），role 不得硬编码。
# =============================================================================
[all:vars]
k8s_vip=192.168.77.7
k8s_service_cidr=172.30.0.0/16
k8s_apiserver_port=6443
k8s_dns_domain=cluster.local

[k8s_master]
cp-a ansible_host=192.168.77.11
cp-b ansible_host=192.168.77.12
cp-c ansible_host=192.168.77.13

[etcd]
cp-a
cp-b
cp-c

[k8s_node]
worker-a ansible_host=192.168.77.21
worker-b ansible_host=192.168.77.22

[local]
localhost ansible_connection=local
