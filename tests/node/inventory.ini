# =============================================================================
#  T008 测试 inventory（单机：真实 etcd + apiserver + containerd + kubelet）
#  说明：
#   - [k8s_master] 供 pki SAN / apiserver role 使用；
#   - [k8s_node]  供 pki 为每个节点签发 kubelet 证书（CN=system:node:<node>）；
#   - [etcd]      单成员，高位端口 12379/12380；
#   - 所有主机 local 连接，测试用高位端口，不占默认 6443/10250。
# =============================================================================
[all:vars]
k8s_version=1.31.0
k8s_vip=127.0.0.1
k8s_apiserver_port=16443
k8s_service_cidr=10.96.0.0/12
k8s_dns_domain=cluster.local

# 测试用官方制品（与 role defaults 的 1.31.0 固定值一致）
kubectl_url=https://dl.k8s.io/v1.31.0/bin/linux/amd64/kubectl
kubectl_sha256=7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380

[k8s_node]
node1 ansible_host=127.0.0.1

[local]
localhost ansible_connection=local
