# =============================================================================
#  T014 加节点流程测试 inventory（单机：既有集群 + 待加入的新节点）
#
#   [k8s_master] cp1  —— 既有控制面（apiserver 渲染目标；pki/etcd 同机）
#   [k8s_node]   node1 —— **既有** worker（真实 kubelet 注册，加节点期间必须零影响）
#                node2 —— **新** worker（未初始化；由 playbooks/add-node.yml 装配并注册）
#   [k8s_existing_node] node1 —— 仅用于沙箱 pki：只为既有节点预签证书，
#                        保证 node2 的 kubelet 证书只能由 add-node 流程签发（真实首跑 changed>0）
#   [etcd]       etcd1 —— 单成员 TLS，高位端口 12379/12380
#
#   全部 local 连接 + 高位端口（16443 / 20250 / 20248 / 20251 / 20249），不占 6443/10250。
#   注：`ansible_connection=local` 是**沙箱专用**（真实入口 playbooks/add-node.yml 走
#   inventory 的连接方式；生产用 ssh）。沙箱 play 自身也显式 connection: local。
# =============================================================================
[all:vars]
ansible_connection=local
k8s_version=1.31.0
k8s_vip=127.0.0.1
k8s_apiserver_port=16443
k8s_service_cidr=10.96.0.0/12
k8s_dns_domain=cluster.local

kubectl_url=https://dl.k8s.io/v1.31.0/bin/linux/amd64/kubectl
kubectl_sha256=7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380

[k8s_node]
node1 ansible_host=127.0.0.1
node2 ansible_host=127.0.0.1

[k8s_existing_node]
node1 ansible_host=127.0.0.1

[local]
localhost ansible_connection=local
