# =============================================================================
#  T016 端到端全流程 · 单机沙箱 inventory（干净副本，每次运行由脚本新建到 $SB）
#
#   [k8s_master] cp1   —— 控制面（apiserver/CM/scheduler 编排目标；pki/etcd 同机）
#                         测试另用 kubectl 创建同名 Node 对象（真实 API 对象，无 kubelet）
#   [etcd]       etcd1 —— 单成员 TLS etcd（12379/12380）
#   [k8s_node]   node1 —— 既有 worker（真实 containerd + kubelet，20250/20248）
#                node2 —— 新 worker（由 playbooks/add-node.yml 签发证书并装配，20251/20249）
#   [k8s_existing_node] node1 —— 只为既有节点预签 kubelet 证书（node2 必须由 add-node 签发）
#
#   与上游套件同一批 role/变量；仅把落盘与端口重定向到沙箱。生产值见 inventory/hosts.example。
# =============================================================================
[all:vars]
ansible_connection=local
k8s_version=1.31.0
k8s_vip=127.0.0.1
k8s_apiserver_port=16443
k8s_service_cidr=10.96.0.0/12
k8s_dns_domain=cluster.local

kubectl_url=https://dl.k8s.io/v1.31.0/bin/linux/amd64/kubectl
kubectl_sha256=7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380

[k8s_node]
node1 ansible_host=127.0.0.1
node2 ansible_host=127.0.0.1

[k8s_existing_node]
node1 ansible_host=127.0.0.1

[local]
localhost ansible_connection=local
