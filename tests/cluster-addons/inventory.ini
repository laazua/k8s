# =============================================================================
#  T011 测试 inventory（单机：真实 pki + etcd + apiserver + CoreDNS 二进制）
# =============================================================================
[all:vars]
k8s_version=1.31.0
k8s_vip=127.0.0.1
k8s_apiserver_port=16443
k8s_service_cidr=10.96.0.0/12
k8s_pod_cidr=10.244.0.0/16
k8s_dns_domain=cluster.local

kubectl_url=https://dl.k8s.io/v1.31.0/bin/linux/amd64/kubectl
kubectl_sha256=7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437

[k8s_master]
cp1 ansible_host=127.0.0.1

[etcd]
etcd1 ansible_host=127.0.0.1 etcd_client_port=12379 etcd_peer_port=12380

[k8s_node]
node1 ansible_host=127.0.0.1

[local]
localhost ansible_connection=local
