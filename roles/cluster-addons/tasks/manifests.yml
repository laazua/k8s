---
- name: "cluster-addons:manifests | 确保清单目录存在"
  ansible.builtin.file:
    path: "{{ cluster_addons_manifest_dir }}"
    state: directory
    mode: "0755"
  tags: ["cluster-addons", "cluster-addons:manifests"]

- name: "cluster-addons:manifests | 渲染 RBAC 清单"
  ansible.builtin.template:
    src: rbac.yaml.j2
    dest: "{{ cluster_addons_manifest_dir }}/rbac.yaml"
    mode: "0644"
  tags: ["cluster-addons", "cluster-addons:manifests"]

- name: "cluster-addons:manifests | 渲染 CoreDNS 清单"
  ansible.builtin.template:
    src: coredns.yaml.j2
    dest: "{{ cluster_addons_manifest_dir }}/coredns.yaml"
    mode: "0644"
  tags: ["cluster-addons", "cluster-addons:manifests"]

- name: "cluster-addons:manifests | 渲染 Corefile"
  ansible.builtin.template:
    src: Corefile.j2
    dest: "{{ cluster_addons_manifest_dir }}/Corefile"
    mode: "0644"
  tags: ["cluster-addons", "cluster-addons:manifests"]
