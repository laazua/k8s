---
- name: "cluster-addons:kubeconfig | 确保 k8s 配置目录存在"
  ansible.builtin.file:
    path: "{{ cluster_addons_root_prefix }}{{ cluster_addons_k8s_dir }}"
    state: directory
    mode: "0755"
  tags: ["cluster-addons", "cluster-addons:kubeconfig"]

- name: "cluster-addons:kubeconfig | 渲染 admin.conf"
  ansible.builtin.template:
    src: admin.kubeconfig.j2
    dest: "{{ cluster_addons_admin_kubeconfig }}"
    mode: "{{ cluster_addons_kubeconfig_mode }}"
    owner: "{{ cluster_addons_kubeconfig_owner }}"
    group: "{{ cluster_addons_kubeconfig_group }}"
    force: "{{ cluster_addons_rotate_kubeconfigs }}"
  no_log: true
  tags: ["cluster-addons", "cluster-addons:kubeconfig"]

- name: "cluster-addons:kubeconfig | 渲染 kubelet.conf"
  ansible.builtin.template:
    src: kubelet.kubeconfig.j2
    dest: "{{ cluster_addons_kubelet_kubeconfig }}"
    mode: "{{ cluster_addons_kubeconfig_mode }}"
    owner: "{{ cluster_addons_kubeconfig_owner }}"
    group: "{{ cluster_addons_kubeconfig_group }}"
    force: "{{ cluster_addons_rotate_kubeconfigs }}"
  no_log: true
  tags: ["cluster-addons", "cluster-addons:kubeconfig"]

- name: "cluster-addons:kubeconfig | 强制权限 0600（umask 无关）"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "{{ cluster_addons_kubeconfig_mode }}"
    owner: "{{ cluster_addons_kubeconfig_owner }}"
    group: "{{ cluster_addons_kubeconfig_group }}"
  loop:
    - "{{ cluster_addons_admin_kubeconfig }}"
    - "{{ cluster_addons_kubelet_kubeconfig }}"
  tags: ["cluster-addons", "cluster-addons:kubeconfig"]
