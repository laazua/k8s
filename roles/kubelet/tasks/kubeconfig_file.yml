---
# =============================================================================
# kubelet:kubeconfig — 渲染 kubelet.conf（证书内嵌；0600 root:root）
#   证书/私钥/CA 已在 validate 阶段强校验；这里只做 base64 内嵌，不复制私钥明文。
# =============================================================================

- name: "kubelet:kubeconfig | 确保 root-dir 存在（kubeconfig 落在此目录）"
  ansible.builtin.file:
    path: "{{ kubelet_root_dir }}"
    state: directory
    mode: "{{ kubelet_root_dir_mode }}"
    owner: "{{ kubelet_root_owner }}"
    group: "{{ kubelet_root_group }}"
  tags: ["kubelet", "kubelet:kubeconfig"]

- name: "kubelet:kubeconfig | 读取证书/私钥/CA（base64）"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ kubelet_client_ca_file }}"
    - "{{ kubelet_client_cert_file }}"
    - "{{ kubelet_client_key_file }}"
  loop_control:
    label: "{{ item }}"
  register: kubelet_credentials
  tags: ["kubelet", "kubelet:kubeconfig"]

- name: "kubelet:kubeconfig | 归一化凭据"
  ansible.builtin.set_fact:
    kubelet_ca_b64: "{{ kubelet_credentials.results[0].content }}"
    kubelet_client_cert_b64: "{{ kubelet_credentials.results[1].content }}"
    kubelet_client_key_b64: "{{ kubelet_credentials.results[2].content }}"
  tags: ["kubelet", "kubelet:kubeconfig"]

- name: "kubelet:kubeconfig | 渲染 kubelet.conf（{{ kubelet_kubeconfig_mode }} root:root）"
  ansible.builtin.template:
    src: kubelet.conf.j2
    dest: "{{ kubelet_kubeconfig_path }}"
    mode: "{{ kubelet_kubeconfig_mode }}"
    owner: "{{ kubelet_root_owner }}"
    group: "{{ kubelet_root_group }}"
  notify: "kubelet:restart"
  tags: ["kubelet", "kubelet:kubeconfig"]
