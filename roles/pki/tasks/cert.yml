---
# =============================================================================
# pki:cert — 为「组件 / 节点」签发一张 leaf 证书
#   输入（vars）：pki_cert（字典：name/cert/key/common_name/organization/ca/
#                 extended_key_usage/sans[/duration_days]）
#   幂等与自愈：判定逻辑见 _needs_regen.yml；额外——若其签发 CA 本次被重建 → 强制重签。
#   原子性：先签进构建目录，再 copy 到最终路径（签名失败不会破坏既有证书）。
#   SAN 归一化：显式 `IP:`/`DNS:` 前缀原样保留；IPv4 字面量判为 `IP:`；其余判为 `DNS:`。
# =============================================================================

- name: "pki:cert | 判定 {{ pki_cert.name }} 的重建需求"
  ansible.builtin.include_tasks: _needs_regen.yml
  vars:
    pki_check_cert: "{{ pki_cert.cert }}"
    pki_check_key: "{{ pki_cert.key }}"
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 汇总重建判定（叠加「签发 CA 本次被重建」）"
  ansible.builtin.set_fact:
    pki_cert_needs_key: "{{ pki_needs_key }}"
    pki_cert_needs_issue: "{{ pki_needs_cert or (pki_ca_rebuilt[pki_cert.ca] | default(true)) }}"
    pki_cert_stem: "{{ pki_cert.name | replace('/', '-') }}"
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 归一化 SAN 条目（{{ pki_cert.name }}）"
  ansible.builtin.set_fact:
    pki_cert_san_entries: >-
      {{ (_pki_sans | select('match', '^(IP|DNS):') | list)
         + (_pki_sans | reject('match', '^(IP|DNS):')
            | select('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}$') | list
            | map('regex_replace', '^(.*)$', 'IP:\1') | list)
         + (_pki_sans | reject('match', '^(IP|DNS):')
            | reject('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}$') | list
            | map('regex_replace', '^(.*)$', 'DNS:\1') | list) }}
  vars:
    _pki_sans: "{{ pki_cert.sans | default([]) | map('string') | list | unique }}"
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 组装 X.509 扩展内容（{{ pki_cert.name }}）"
  ansible.builtin.set_fact:
    pki_cert_ext_lines: >-
      {{ ['[v3_ext]',
          'basicConstraints = critical,CA:FALSE',
          'keyUsage = critical,digitalSignature,keyEncipherment',
          'extendedKeyUsage = ' ~ pki_cert.extended_key_usage]
         + (['subjectAltName = ' ~ (pki_cert_san_entries | join(','))]
            if (pki_cert_san_entries | length > 0) else []) }}
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 生成私钥 {{ pki_cert.key }}（{{ pki_key_type }}）"
  ansible.builtin.command:
    cmd: >-
      openssl genpkey -algorithm {{ pki_key_algorithm }}
      -pkeyopt {{ pki_key_generation_opt }}
      -out {{ pki_cert.key }}
  when: pki_cert_needs_key
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 强制私钥权限 {{ pki_key_mode }}（openssl 受 umask 影响）"
  ansible.builtin.file:
    path: "{{ pki_cert.key }}"
    mode: "{{ pki_key_mode }}"
    owner: "{{ pki_file_owner }}"
    group: "{{ pki_file_group }}"
  when: pki_cert_needs_key
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 准备构建目录（仅重签时需要；首跑后目录已被清理）"
  ansible.builtin.file:
    path: "{{ pki_build_dir }}"
    state: directory
    mode: "0700"
    owner: "{{ pki_file_owner }}"
    group: "{{ pki_file_group }}"
  when: pki_cert_needs_issue
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 渲染 X.509 扩展文件（{{ pki_cert.name }}，含 SAN）"
  ansible.builtin.copy:
    dest: "{{ pki_build_dir }}/{{ pki_cert_stem }}.ext"
    content: "{{ (pki_cert_ext_lines | join('\n')) ~ '\n' }}"
    mode: "0600"
  when: pki_cert_needs_issue
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 生成 CSR（{{ pki_cert.name }}）"
  ansible.builtin.command:
    cmd: >-
      openssl req -new -key {{ pki_cert.key }}
      -out {{ pki_build_dir }}/{{ pki_cert_stem }}.csr
      -subj "/CN={{ pki_cert.common_name }}{{ ('/O=' ~ pki_cert.organization) if (pki_cert.organization | default('') | length > 0) else '' }}"
      -{{ pki_digest }}
  when: pki_cert_needs_issue
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 由 {{ pki_cert.ca }} CA 签发证书（{{ pki_cert.name }}）"
  ansible.builtin.command:
    cmd: >-
      openssl x509 -req
      -in {{ pki_build_dir }}/{{ pki_cert_stem }}.csr
      -CA {{ pki_cas[pki_cert.ca].cert }} -CAkey {{ pki_cas[pki_cert.ca].key }}
      -CAcreateserial -CAserial {{ pki_build_dir }}/{{ pki_cert.ca }}.srl
      -out {{ pki_build_dir }}/{{ pki_cert_stem }}.crt
      -days {{ pki_cert.duration_days | default(pki_cert_duration_days) }}
      -{{ pki_digest }}
      -extfile {{ pki_build_dir }}/{{ pki_cert_stem }}.ext
      -extensions v3_ext
  when: pki_cert_needs_issue
  tags: ["pki", "pki:cert"]

- name: "pki:cert | 安装证书到 {{ pki_cert.cert }}"
  ansible.builtin.copy:
    src: "{{ pki_build_dir }}/{{ pki_cert_stem }}.crt"
    dest: "{{ pki_cert.cert }}"
    remote_src: true
    mode: "{{ pki_cert_mode }}"
    owner: "{{ pki_file_owner }}"
    group: "{{ pki_file_group }}"
  when: pki_cert_needs_issue
  tags: ["pki", "pki:cert"]
