# =============================================================================
# roles/pki — handlers
#
# 设计说明：本 role 只**生成证书文件**，不重启任何服务（组件在后续任务里首次启动
# 时自行读取证书）。因此不定义 handler，保留本文件以维持 role 结构约定。
# 若后续任务需要在证书轮换后重启组件，应由其自己的 role 用 `notify` 实现
# （本 role 的任务可被 `when: pki_cert_needs_issue` 判定结果为 changed 触发外部 handler）。
# =============================================================================
