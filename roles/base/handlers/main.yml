# =============================================================================
# roles/base — handlers
#
# 设计说明（重要）：
#   本 role 的“配置变更 → 生效”采用 system.yml 中的**幂等命令任务**实现
#   （`sysctl --system` 用 changed_when: false；`modprobe` 由模块自身保证幂等），
#   故意不使用 notify/handler：
#     1) handler 不受 --skip-tags 过滤时会意外在控制机执行（曾导致沙箱测试污染宿主）；
#     2) 重复的 notify + 任务会双跑同一条命令。
#   故此处不定义 handler，保留文件以维持 role 结构约定。
# =============================================================================
