---
# =============================================================================
# roles/kube-controller-manager — 入口
#   facts → validate → binary → config → service
# =============================================================================

- name: "kube-controller-manager:facts | 推导启动参数"
  ansible.builtin.import_tasks: facts.yml
  tags: ["kube-controller-manager", "kube-controller-manager:facts"]

- name: "kube-controller-manager:validate | 前置校验（fail fast）"
  ansible.builtin.import_tasks: validate.yml
  tags: ["kube-controller-manager", "kube-controller-manager:validate"]

- name: "kube-controller-manager:binary | 安装官方二进制"
  ansible.builtin.import_tasks: binary.yml
  tags: ["kube-controller-manager", "kube-controller-manager:binary"]

- name: "kube-controller-manager:config | systemd unit"
  ansible.builtin.import_tasks: config.yml
  tags: ["kube-controller-manager", "kube-controller-manager:config"]

- name: "kube-controller-manager:service | 启用并启动"
  ansible.builtin.import_tasks: service.yml
  tags: ["kube-controller-manager", "kube-controller-manager:service"]
