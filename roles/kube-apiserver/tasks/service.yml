---
# =============================================================================
# kube-apiserver:service — 生产服务管理
#   `kube_apiserver_manage_service=false`（共享开发机/沙箱）时不调用 systemctl。
#   unit 已由 config.yml 落盘；daemon-reload 保证新 unit 生效。
# =============================================================================

- name: "kube-apiserver:service | 启用并启动 {{ kube_apiserver_unit_name }}"
  ansible.builtin.systemd:
    name: "{{ kube_apiserver_unit_name }}"
    enabled: "{{ kube_apiserver_service_enabled }}"
    state: "{{ kube_apiserver_service_state }}"
    daemon_reload: true
  when: kube_apiserver_manage_service | bool
  tags: ["kube-apiserver", "kube-apiserver:service"]
