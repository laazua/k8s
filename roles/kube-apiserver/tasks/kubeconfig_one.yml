---
# =============================================================================
# kube-apiserver:kubeconfig_one — 渲染单份 kubeconfig（证书内嵌）
#   输入：kube_apiserver_kubeconfig { name, user, path, cert, key }
#   幂等：内容不变 → changed=0；不重启任何服务（kubeconfig 仅客户端消费）。
# =============================================================================

- name: "kube-apiserver:kubeconfig | 读取 {{ kube_apiserver_kubeconfig.name }} CA"
  ansible.builtin.slurp:
    src: "{{ kube_apiserver_client_ca_file }}"
  register: kube_apiserver_kubeconfig_ca
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]

- name: "kube-apiserver:kubeconfig | 读取 {{ kube_apiserver_kubeconfig.name }} 客户端证书"
  ansible.builtin.slurp:
    src: "{{ kube_apiserver_kubeconfig.cert }}"
  register: kube_apiserver_kubeconfig_cert
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]

- name: "kube-apiserver:kubeconfig | 读取 {{ kube_apiserver_kubeconfig.name }} 客户端私钥"
  ansible.builtin.slurp:
    src: "{{ kube_apiserver_kubeconfig.key }}"
  register: kube_apiserver_kubeconfig_key
  no_log: true
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]

- name: "kube-apiserver:kubeconfig | 渲染 {{ kube_apiserver_kubeconfig.name }}（{{ kube_apiserver_kubeconfig_mode }}）"
  ansible.builtin.template:
    src: kubeconfig.j2
    dest: "{{ kube_apiserver_kubeconfig.path }}"
    mode: "{{ kube_apiserver_kubeconfig_mode }}"
    owner: "{{ kube_apiserver_kubeconfig_owner }}"
    group: "{{ kube_apiserver_kubeconfig_group }}"
  vars:
    kubeconfig_user: "{{ kube_apiserver_kubeconfig.user }}"
    kubeconfig_cluster: "{{ kube_apiserver_kubeconfig_cluster_name }}"
    kubeconfig_server: "{{ kube_apiserver_kubeconfig_server }}"
    kubeconfig_ca_b64: "{{ kube_apiserver_kubeconfig_ca.content }}"
    kubeconfig_cert_b64: "{{ kube_apiserver_kubeconfig_cert.content }}"
    kubeconfig_key_b64: "{{ kube_apiserver_kubeconfig_key.content }}"
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]
