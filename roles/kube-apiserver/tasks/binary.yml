---
# =============================================================================
# kube-apiserver:binary — 官方二进制获取与安装（强制 sha256）
#   1) 目录 root:root 0755
#   2) sha256：优先显式/已知固定值；否则读取官方 `<url>.sha256` 侧车
#      —— **制品已存在但未固定 sha256** 时直接失败（离线部署必须固定哈希）
#   3) 复用 download role（代理 / 缓存 / sha256 校验）
#   4) 安装到 kube_apiserver_bin_dir（内容不变 → changed=0，不触发重启）
#   5) 断言 `--version` 与 kube_apiserver_version 一致（防缓存/URL 错配）
# =============================================================================

- name: "kube-apiserver:binary | 创建制品与安装目录（{{ kube_apiserver_root_owner }}:{{ kube_apiserver_root_group }} 0755）"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ kube_apiserver_root_owner }}"
    group: "{{ kube_apiserver_root_group }}"
  loop:
    - "{{ kube_apiserver_artifact_dir }}"
    - "{{ kube_apiserver_bin_dir }}"
  loop_control:
    label: "{{ item }}"
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 检查既有制品"
  ansible.builtin.stat:
    path: "{{ kube_apiserver_artifact_path }}"
  register: kube_apiserver_artifact_stat
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 断言既有制品必须显式固定 sha256（离线可复现）"
  ansible.builtin.assert:
    that:
      - kube_apiserver_resolved_sha256 | length == 64
    fail_msg: >-
      制品 {{ kube_apiserver_artifact_path }} 已存在，但未提供 kube_apiserver_sha256。
      离线部署必须显式固定哈希（不可用本地文件自证）；请设置
      kube_apiserver_sha256 或使用已知版本（kube_apiserver_known_sha256）。
    quiet: true
  when:
    - kube_apiserver_resolved_sha256 | length == 0
    - kube_apiserver_artifact_stat.stat.exists
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 读取官方 sha256 侧车（未固定且制品缺失时）"
  ansible.builtin.uri:
    url: "{{ kube_apiserver_download_url }}.sha256"
    return_content: true
    status_code: 200
    timeout: "{{ kube_apiserver_checksum_timeout }}"
  register: kube_apiserver_checksum_response
  when:
    - kube_apiserver_resolved_sha256 | length == 0
    - not kube_apiserver_artifact_stat.stat.exists
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 解析并校验官方 sha256"
  ansible.builtin.set_fact:
    kube_apiserver_resolved_sha256: "{{ (kube_apiserver_checksum_response.content | default('') | trim | lower).split(' ')[0] }}"
  when:
    - kube_apiserver_resolved_sha256 | length == 0
    - not kube_apiserver_artifact_stat.stat.exists
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 断言解析出的 sha256 合法"
  ansible.builtin.assert:
    that:
      - kube_apiserver_resolved_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      无法从 {{ kube_apiserver_download_url }}.sha256 获取合法 sha256：
      '{{ kube_apiserver_resolved_sha256 }}'。请显式设置 kube_apiserver_sha256。
    quiet: true
  when: kube_apiserver_resolved_sha256 | length > 0
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 下载官方二进制（复用 download role 的缓存/代理/sha256）"
  ansible.builtin.include_role:
    name: download
  vars:
    download_root_prefix: "{{ kube_apiserver_root_prefix }}"
    download_cache_dir: "{{ kube_apiserver_artifact_dir }}"
    download_file_owner: "{{ kube_apiserver_root_owner }}"
    download_file_group: "{{ kube_apiserver_root_group }}"
    download_timeout: "{{ kube_apiserver_download_timeout }}"
    download_retries: "{{ kube_apiserver_download_retries }}"
    download_retry_delay: "{{ kube_apiserver_download_retry_delay }}"
    download_items:
      - name: kube-apiserver
        url: "{{ kube_apiserver_download_url }}"
        sha256: "{{ kube_apiserver_resolved_sha256 }}"
        dest: "{{ kube_apiserver_artifact_path }}"
        mode: "0644"
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 安装 kube-apiserver（{{ kube_apiserver_bin_mode }} {{ kube_apiserver_root_owner }}:{{ kube_apiserver_root_group }}）"
  ansible.builtin.copy:
    src: "{{ kube_apiserver_artifact_path }}"
    dest: "{{ kube_apiserver_binary }}"
    remote_src: true
    mode: "{{ kube_apiserver_bin_mode }}"
    owner: "{{ kube_apiserver_root_owner }}"
    group: "{{ kube_apiserver_root_group }}"
  notify: "kube-apiserver:restart"
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 读取已安装版本"
  ansible.builtin.command:
    cmd: "{{ kube_apiserver_binary }} --version"
  register: kube_apiserver_version_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["kube-apiserver", "kube-apiserver:binary"]

- name: "kube-apiserver:binary | 断言实际版本与 kube_apiserver_version 一致"
  ansible.builtin.assert:
    that:
      - kube_apiserver_version_check.rc == 0
      - ("v" ~ kube_apiserver_version) in (kube_apiserver_version_check.stdout | default(''))
    fail_msg: >-
      已安装 kube-apiserver 版本与 kube_apiserver_version={{ kube_apiserver_version }} 不一致：
      {{ kube_apiserver_version_check.stdout | default(kube_apiserver_version_check.stderr | default('(无法执行 --version)')) }}。
      请检查制品 URL / sha256 是否对应目标版本。
    quiet: true
  tags: ["kube-apiserver", "kube-apiserver:binary"]
