---
# =============================================================================
# kube-apiserver:kubeconfigs — 控制面引导
#   1) 签发 controller-manager / scheduler / kubelet-client 客户端证书
#   2) 用内嵌 TLS 客户端证书渲染 admin / controller-manager / scheduler 的 kubeconfig
#   3) 清理构建目录（CSR/扩展/序列号）
#   kubeconfig 的 server 默认指向 VIP（HA 前置 LB），单机可覆盖。
# =============================================================================

- name: "kube-apiserver:kubeconfigs | 签发控制面客户端证书（{{ kube_apiserver_client_certs | length }} 张）"
  ansible.builtin.include_tasks: client_cert.yml
  loop: "{{ kube_apiserver_client_certs }}"
  loop_control:
    loop_var: kube_apiserver_client_cert
    label: "{{ kube_apiserver_client_cert.name }}"
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig", "kube-apiserver:cert"]

- name: "kube-apiserver:kubeconfigs | 确保配置目录存在（{{ kube_apiserver_config_dir_mode }}）"
  ansible.builtin.file:
    path: "{{ kube_apiserver_config_dir }}"
    state: directory
    mode: "{{ kube_apiserver_config_dir_mode }}"
    owner: "{{ kube_apiserver_root_owner }}"
    group: "{{ kube_apiserver_root_group }}"
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]

- name: "kube-apiserver:kubeconfigs | 渲染 kubeconfig（{{ kube_apiserver_kubeconfigs | length }} 份）"
  ansible.builtin.include_tasks: kubeconfig_one.yml
  loop: "{{ kube_apiserver_kubeconfigs }}"
  loop_control:
    loop_var: kube_apiserver_kubeconfig
    label: "{{ kube_apiserver_kubeconfig.name }}"
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]

- name: "kube-apiserver:kubeconfigs | 清理客户端证书构建目录"
  ansible.builtin.file:
    path: "{{ kube_apiserver_client_cert_build_dir }}"
    state: absent
  when: kube_apiserver_client_cert_cleanup_build_dir | bool
  tags: ["kube-apiserver", "kube-apiserver:kubeconfig"]
