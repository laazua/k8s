---
# =============================================================================
# keepalived:config — 安装/断言二进制 + 渲染 keepalived.conf
#   幂等：内容不变 → changed=0 且不 notify。
# =============================================================================

- name: "keepalived:config | 安装 keepalived 包"
  ansible.builtin.package:
    name: "{{ keepalived_package_name }}"
    state: present
  when: keepalived_manage_package | bool
  tags: ["keepalived", "keepalived:config"]

- name: "keepalived:config | 检查 keepalived 二进制"
  ansible.builtin.stat:
    path: "{{ keepalived_binary }}"
  register: keepalived_binary_stat
  tags: ["keepalived", "keepalived:config"]

- name: "keepalived:config | 断言 keepalived 二进制存在且可执行"
  ansible.builtin.assert:
    that:
      - keepalived_binary_stat.stat.exists
      - keepalived_binary_stat.stat.executable
    fail_msg: >-
      keepalived 二进制不可用：{{ keepalived_binary }}。
      请安装 keepalived 包，或设置 keepalived_binary 指向真实可执行文件。
    quiet: true
  tags: ["keepalived", "keepalived:config"]

- name: "keepalived:config | 创建配置目录"
  ansible.builtin.file:
    path: "{{ keepalived_config_dir }}"
    state: directory
    mode: "0755"
  tags: ["keepalived", "keepalived:config"]

- name: "keepalived:config | 渲染 keepalived.conf"
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_file }}"
    mode: "{{ keepalived_config_mode }}"
  notify: "keepalived:restart"
  tags: ["keepalived", "keepalived:config"]
