---
# =============================================================================
# roles/etcd — 入口
#   etcd:facts    → 从 inventory 分组 / etcd_members 推导成员、URL、initial-cluster
#   etcd:validate → 奇数成员 / 最小成员数 / 唯一性 / 当前主机 / TLS 证书（fail fast）
#   etcd:user     → 系统用户/组（沙箱测试跳过）
#   etcd:binary   → download role 取包 + 解包 + 安装 + 版本断言
#   etcd:config   → 数据目录 + 渲染 systemd unit（变更 notify 重启）
#   etcd:service  → 启用/启动（生产；测试 etcd_manage_service=false）
# =============================================================================

- name: "etcd:facts | 推导成员、URL 与 initial-cluster"
  ansible.builtin.import_tasks: facts.yml
  tags: [etcd, "etcd:facts"]

- name: "etcd:validate | 奇数成员与 TLS 前置校验（fail fast）"
  ansible.builtin.import_tasks: validate.yml
  tags: [etcd, "etcd:validate"]

- name: "etcd:user | 创建 etcd 系统组"
  ansible.builtin.group:
    name: "{{ etcd_user_group }}"
    system: true
  when: etcd_manage_user | bool
  tags: [etcd, "etcd:user"]

- name: "etcd:user | 创建 etcd 系统用户"
  ansible.builtin.user:
    name: "{{ etcd_user }}"
    group: "{{ etcd_user_group }}"
    system: true
    shell: "{{ etcd_user_shell }}"
    create_home: false
  when: etcd_manage_user | bool
  tags: [etcd, "etcd:user"]

- name: "etcd:binary | 获取/安装官方二进制"
  ansible.builtin.import_tasks: binary.yml
  tags: [etcd, "etcd:binary"]

- name: "etcd:config | 数据目录与 systemd unit"
  ansible.builtin.import_tasks: config.yml
  tags: [etcd, "etcd:config"]

- name: "etcd:service | 启用并启动 etcd"
  ansible.builtin.import_tasks: service.yml
  tags: [etcd, "etcd:service"]
