---
# =============================================================================
# etcd:config — 数据目录 + systemd unit 渲染
#   属主模型（B2）：
#     - 数据目录：<etcd 用户>:<etcd 组> 0700（服务用户独占）
#     - systemd unit 目录/文件：root:root（0755 / 0644）→ 服务用户不可改写
#   幂等：目录内容/权限不变 → changed=0；unit 模板内容不变 → changed=0 且不 notify。
#   重启判定：unit 内容变化（template changed）、二进制/证书变化才 notify `etcd:restart`。
# =============================================================================

- name: "etcd:config | 创建数据目录父级（root:root 0755，保证服务用户可遍历）"
  ansible.builtin.file:
    path: "{{ etcd_member_data_dir | dirname }}"
    state: directory
    mode: "0755"
    owner: "{{ etcd_root_owner }}"
    group: "{{ etcd_root_group }}"
  tags: ["etcd", "etcd:config"]

- name: "etcd:config | 创建成员数据目录（{{ etcd_data_dir_mode }} {{ etcd_data_owner }}:{{ etcd_data_group }}）"
  ansible.builtin.file:
    path: "{{ etcd_member_data_dir }}"
    state: directory
    mode: "{{ etcd_data_dir_mode }}"
    owner: "{{ etcd_data_owner }}"
    group: "{{ etcd_data_group }}"
  tags: ["etcd", "etcd:config"]

- name: "etcd:config | 创建 systemd unit 目录（{{ etcd_root_owner }}:{{ etcd_root_group }} 0755）"
  ansible.builtin.file:
    path: "{{ etcd_unit_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ etcd_root_owner }}"
    group: "{{ etcd_root_group }}"
  tags: ["etcd", "etcd:config"]

- name: "etcd:config | 渲染 etcd systemd unit（{{ etcd_root_owner }}:{{ etcd_root_group }} {{ etcd_unit_mode }}）"
  ansible.builtin.template:
    src: etcd.service.j2
    dest: "{{ etcd_unit_path }}"
    mode: "{{ etcd_unit_mode }}"
    owner: "{{ etcd_root_owner }}"
    group: "{{ etcd_root_group }}"
  notify: "etcd:restart"
  tags: ["etcd", "etcd:config"]
