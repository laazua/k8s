---
# =============================================================================
# roles/etcd — handlers
#   只在 unit 内容、二进制或证书内容变化时被 notify。
#   重启采用**滚动语义**（D3）：throttle=1 保证跨主机串行，且每个成员重启后
#   必须等本成员 health 恢复 + 集群多数派存活，才允许下一个成员重启。
#   `etcd_manage_service=false`（沙箱/受限环境）时 systemd 动作被跳过；
#   若提供了测试重启钩子（etcd_service_restart_argv）则用该命令真实重启本成员。
# =============================================================================

- name: "etcd:restart"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/rolling_restart.yml"
  tags: ["etcd", "etcd:restart"]
