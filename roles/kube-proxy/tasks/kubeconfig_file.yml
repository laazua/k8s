---
# =============================================================================
# kube-proxy:kubeconfig — 落盘 kubeconfig（0600 root:root）
#   source  : 复制既有 kubeconfig（默认 admin.conf；生产应提供专用 system:kube-proxy）
#   embedded: 读取 CA/cert/key 并渲染内嵌证书的 kubeconfig（不落明文私钥副本）
#   证书/文件缺失已在 validate 阶段 fail-fast。
# =============================================================================

- name: "kube-proxy:kubeconfig | 确保配置目录存在"
  ansible.builtin.file:
    path: "{{ kube_proxy_config_dir }}"
    state: directory
    mode: "{{ kube_proxy_config_dir_mode }}"
    owner: "{{ kube_proxy_root_owner }}"
    group: "{{ kube_proxy_root_group }}"
  tags: ["kube-proxy", "kube-proxy:kubeconfig"]

- name: "kube-proxy:kubeconfig | 复制既有 kubeconfig（source 模式，0600 root:root）"
  ansible.builtin.copy:
    src: "{{ kube_proxy_kubeconfig_source }}"
    dest: "{{ kube_proxy_kubeconfig_path }}"
    remote_src: true
    mode: "{{ kube_proxy_kubeconfig_mode }}"
    owner: "{{ kube_proxy_root_owner }}"
    group: "{{ kube_proxy_root_group }}"
  when: kube_proxy_kubeconfig_source_mode == 'source'
  notify: "kube-proxy:restart"
  tags: ["kube-proxy", "kube-proxy:kubeconfig"]

- name: "kube-proxy:kubeconfig | 读取 CA/cert/key（embedded 模式，base64）"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ kube_proxy_client_ca_file }}"
    - "{{ kube_proxy_client_cert_file }}"
    - "{{ kube_proxy_client_key_file }}"
  loop_control:
    label: "{{ item }}"
  register: kube_proxy_credentials
  when: kube_proxy_kubeconfig_source_mode == 'embedded'
  tags: ["kube-proxy", "kube-proxy:kubeconfig"]

- name: "kube-proxy:kubeconfig | 归一化凭据（embedded 模式）"
  ansible.builtin.set_fact:
    kube_proxy_ca_b64: "{{ kube_proxy_credentials.results[0].content }}"
    kube_proxy_client_cert_b64: "{{ kube_proxy_credentials.results[1].content }}"
    kube_proxy_client_key_b64: "{{ kube_proxy_credentials.results[2].content }}"
  when: kube_proxy_kubeconfig_source_mode == 'embedded'
  tags: ["kube-proxy", "kube-proxy:kubeconfig"]

- name: "kube-proxy:kubeconfig | 渲染内嵌证书的 kubeconfig（embedded 模式，0600）"
  ansible.builtin.template:
    src: kube-proxy.conf.j2
    dest: "{{ kube_proxy_kubeconfig_path }}"
    mode: "{{ kube_proxy_kubeconfig_mode }}"
    owner: "{{ kube_proxy_root_owner }}"
    group: "{{ kube_proxy_root_group }}"
  when: kube_proxy_kubeconfig_source_mode == 'embedded'
  notify: "kube-proxy:restart"
  tags: ["kube-proxy", "kube-proxy:kubeconfig"]
