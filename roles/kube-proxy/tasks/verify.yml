---
# =============================================================================
# kube-proxy:verify — 落盘产物自检（只读、幂等；不依赖 systemd）
#   断言二进制/配置/kubeconfig/unit 存在、kubeconfig 权限 0600 root:root。
# =============================================================================

- name: "kube-proxy:verify | 检查产物"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ kube_proxy_binary }}"
    - "{{ kube_proxy_config_path }}"
    - "{{ kube_proxy_kubeconfig_path }}"
    - "{{ kube_proxy_unit_path }}"
  loop_control:
    label: "{{ item }}"
  register: kube_proxy_verify_stat
  tags: ["kube-proxy", "kube-proxy:verify"]

- name: "kube-proxy:verify | 断言产物齐全"
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "kube-proxy 产物缺失：{{ item.item }}（binary/config/kubeconfig/unit 必须全部落盘）。"
    quiet: true
  loop: "{{ kube_proxy_verify_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: ["kube-proxy", "kube-proxy:verify"]

- name: "kube-proxy:verify | 断言 kubeconfig 权限 0600 root:root"
  ansible.builtin.assert:
    that:
      - kube_proxy_verify_stat.results[2].stat.mode == kube_proxy_kubeconfig_mode
      - kube_proxy_verify_stat.results[2].stat.pw_name == kube_proxy_root_owner
      - kube_proxy_verify_stat.results[2].stat.gr_name == kube_proxy_root_group
    fail_msg: >-
      kube-proxy.conf 权限/属主不符：期望 {{ kube_proxy_kubeconfig_mode }}
      {{ kube_proxy_root_owner }}:{{ kube_proxy_root_group }}，实际
      {{ kube_proxy_verify_stat.results[2].stat.mode }}
      {{ kube_proxy_verify_stat.results[2].stat.pw_name }}:{{ kube_proxy_verify_stat.results[2].stat.gr_name }}。
    quiet: true
  tags: ["kube-proxy", "kube-proxy:verify"]
