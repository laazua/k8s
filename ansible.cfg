# =============================================================================
# Ansible 配置 · Kubernetes 二进制部署
# 说明：所有可变项（版本/发行版/代理/CIDR/VIP）均通过 group_vars 配置，禁止硬编码。
# =============================================================================
[defaults]
# 默认 inventory：优先本地 hosts.ini，缺失时回退到示例（便于开箱验证）
inventory            = inventory/hosts.ini, inventory/hosts.example
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
deprecation_warnings = False
nocows               = 1

[ssh_connection]
pipelining = True
